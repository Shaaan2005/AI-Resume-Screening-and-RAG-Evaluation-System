<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#1a2e39;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#f7fafc;background-image:radial-gradient(rgba(255,255,255,0.015) 1px,transparent 1px);background-size:24px 24px}
.auth-card{background:#203743;border-radius:12px;padding:36px 40px 40px;width:380px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.auth-card::before{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:180px;height:2px;background:linear-gradient(90deg,transparent,#009393,transparent);border-radius:2px}
.auth-logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.auth-logo svg{width:32px;height:32px}
.auth-logo span{font-size:17px;font-weight:700;color:#f7fafc}
.auth-sub{text-align:center;font-size:13px;color:#9fbed0;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#e2eef4;margin-bottom:5px}
.form-group input{width:100%;padding:10px 12px;background:#13232d;border:1px solid rgba(255,255,255,0.04);border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;color:#f7fafc;outline:none;transition:all 0.15s}
.form-group input:focus{border-color:rgba(0,147,147,0.15)}
.form-group input::placeholder{color:#9fbed0}
.btn-submit{width:100%;padding:10px 20px;background:#009393;color:#13232d;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;border:none;border-radius:6px;cursor:pointer;transition:all 0.15s;margin-top:4px}
.btn-submit:hover{background:#007a7a}
.auth-footer{text-align:center;margin-top:18px;font-size:13px;color:#9fbed0}
.auth-footer a{color:#3178f6;text-decoration:none;font-weight:600}
.auth-footer a:hover{color:#1475e1}
.error{background:rgba(255,60,60,0.08);border:1px solid rgba(255,60,60,0.15);color:#ff6b6b;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:500;margin-bottom:16px;text-align:center}
.pw-toggle{position:relative}
.pw-toggle .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#9fbed0;font-size:14px;user-select:none;background:none;border:none;padding:0;font-family:'Inter',sans-serif}
</style>
</head>
<body>
<div class="auth-card">
<div class="auth-logo">
<svg viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="8" fill="#009393"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#13232d" font-size="16" font-weight="800" font-family="Inter">AI</text></svg>
<span>AI Resume Screening</span>
</div>
<div class="auth-sub">Create a new account</div>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
<div class="form-group"><label>Username</label><input type="text" name="username" placeholder="Choose a username (min 3 characters)" required></div>
<div class="form-group"><label>Email</label><input type="email" name="email" placeholder="Enter your email" required></div>
<div class="form-group"><label>Password</label><div class="pw-toggle"><input type="password" name="password" id="password" placeholder="Choose a password (min 4 characters)" required><button type="button" class="eye" onclick="togglePw()">&#128065;</button></div></div>
<button type="submit" class="btn-submit">Create Account</button>
</form>
<div class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log In</a></div>
</div>
<script>
function togglePw(){var p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}
</script>
</body>
</html>
